name: Build and Push locked SCAIL v1.0.24
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: '1.0.24'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Static regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: for script in init_or_check_nodes.sh startup_banner.sh SCAIL_down_a1.sh Wan2.1_Vace_a1.sh scripts/*.sh; do bash -n "$script"; done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/40_scail_comfyui_classu" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runtime installer image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SCAIL_RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          tags: |
            ${{ steps.image.outputs.name }}:v${{ env.RELEASE_VERSION }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Record image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Release: $IMAGE:v$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'Packages and nodes install on RunPod from the bundled locks. GPU checks run on Pod startup.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use the digest, never a mutable tag, in the production RunPod template.' >> "$GITHUB_STEP_SUMMARY"
